environment:
  id: ALE/Assault-v5
  obs_type: rgb
  frame_skip: 4
  repeat_action_probability: 0.25
  full_action_space: false
  render_mode: null

preprocessing:
  grayscale: true
  resize_height: 84
  resize_width: 84
  frame_stack: 4
  dtype: uint8
  normalize_pixels_in_env: false

reproducibility:
  seed: 42

evaluation:
  episodes: 10

network:
  input_channels: 4
  num_actions: 7

agent:
  gamma: 0.99
  learning_rate: 0.0001
  epsilon_start: 1.0
  epsilon_final: 0.01

replay_buffer:
  capacity: 1024
  batch_size: 32

training:
  total_timesteps: 48
  learning_starts: 32
  train_frequency: 4
  target_update_frequency: 16
  epsilon_decay_steps: 48

checkpointing:
  enabled: true
  interval_steps: 24
  directory: checkpoints
  mode: new
  run_id: assault_ddqn_exp_001
  resume_checkpoint: null
  save_replay_buffer: true

tensorboard:
  enabled: true
  directory: logs/tensorboard
  log_frequency_steps: 4
  reward_window_episodes: 10
  flush_frequency_steps: 24

mlflow:
  enabled: true
  experiment_name: assault_ddqn
  tracking_uri: null
  local_directory: logs/mlflow
  tracking_mode: new
  mlflow_run_id: null
  tracking_session_id: session_001
  artifact_location: null
  log_checkpoint_binary: false

e2e_smoke:
  enabled: true
  segment_a_timesteps: 48
  final_timesteps: 64
  evaluation_episodes: 2
  evaluation_epsilon: 0.0
  evaluation_max_steps_per_episode: 256
  replay_buffer_capacity: 128
  require_cuda: true
