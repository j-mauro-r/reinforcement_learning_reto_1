environment:
  id: ALE/Assault-v5
  obs_type: rgb
  frame_skip: 4
  repeat_action_probability: 0.25
  full_action_space: false
  render_mode: null

preprocessing:
  grayscale: true
  resize_height: 84
  resize_width: 84
  frame_stack: 4
  dtype: uint8
  normalize_pixels_in_env: false

reproducibility:
  seed: 42

evaluation:
  episodes: 10

network:
  input_channels: 4
  num_actions: 7

agent:
  gamma: 0.99
  learning_rate: 0.0001
  epsilon_start: 1.0
  epsilon_final: 0.01

replay_buffer:
  capacity: 1024
  batch_size: 32

training:
  total_timesteps: 48
  learning_starts: 32
  train_frequency: 4
  target_update_frequency: 16
  epsilon_decay_steps: 48
