environment:
  env_id: "ALE/BattleZone-v5"
  seed: 20260903
  mode: 1
  difficulty: 0
  obs_type: "rgb"
  frameskip: 4
  repeat_action_probability: 0.25
  expected_action_space_n: 18
  render_mode: null

preprocessing:
  pipeline_name: "battlezone_rgb_128_stack4_no_crop"
  color_mode: "rgb"
  resize:
    enabled: true
    width: 128
    height: 128
    interpolation: "bilinear"
  crop:
    enabled: false
    top: 0
    bottom: 210
    left: 0
    right: 160
  frame_stack: 4
  dtype: "uint8"
  normalize: false
  reward_transform: "none"

modes:
  train:
    seed_offset: 0
    render_mode: null
  eval:
    seed_offset: 10000
    render_mode: null

validation:
  smoke_steps: 32
  action_sequence_check_steps: 32
  expected_raw_shape: [210, 160, 3]
  expected_final_shape: [4, 128, 128, 3]
  candidate_preprocessing:
    - name: "rgb_84_no_crop_stack4"
      color_mode: "rgb"
      resize: [84, 84]
      crop_enabled: false
      frame_stack: 4
      rationale: "Atari common-size comparison; not selected because radar and small objects are less readable."
    - name: "grayscale_84_no_crop_stack4"
      color_mode: "grayscale"
      resize: [84, 84]
      crop_enabled: false
      frame_stack: 4
      rationale: "Channel-reduced comparison; not selected because color/radar contrast may be useful."
    - name: "rgb_128_no_crop_stack4"
      color_mode: "rgb"
      resize: [128, 128]
      crop_enabled: false
      frame_stack: 4
      rationale: "Selected compromise: preserves radar and color while reducing raw dimensionality."

algorithm: "DQN"

dqn:
  baseline_note: "baseline de implementacion por validar"
  device: "auto"
  gamma: 0.99
  learning_rate: 0.00025
  batch_size: 8
  replay_buffer:
    capacity: 128
    storage_dtype: "uint8"
    sampling: "uniform"
  network:
    frame_stack: 4
    input_channels: 3
    conv_channels: [32, 64, 64]
    hidden_dim: 512
    output_actions: 18
    pixel_scale_divisor: 255.0
    input_layout: "(batch, frame_stack, height, width, channels)"
    torch_layout: "NCHW with channels = frame_stack * input_channels"
  optimizer:
    name: "adam"
  loss:
    name: "smooth_l1"
  epsilon:
    api_default: 0.1

training:
  baseline_note: "baseline de implementacion por validar"
  total_timesteps: 256
  learning_starts: 32
  train_frequency: 4
  target_sync_interval: 64
  epsilon:
    start: 1.0
    end: 0.05
    decay_steps: 1024

checkpointing:
  enabled: true
  baseline_note: "baseline de implementacion por validar"
  directory: "3_BattleZone/checkpoints"
  interval_steps: 64
  default_mode: "full"
  schema_version: 1
  allow_overwrite: false

tensorboard:
  enabled: true
  baseline_note: "baseline de implementacion por validar"
  log_dir: "3_BattleZone/logs"
  scalar_log_interval_steps: 4
  reward_window: 10
  flush_interval_steps: 64

tracking:
  enabled: true
  results_dir: "3_BattleZone/results"
  manifest_filename: "run_manifest.json"
  schema_version: 1
  require_clean_git_for_long_run: true

long_training:
  enabled: true
  profile: "improved_v2"
  target_global_step: 1000000
  require_accelerator: true
  preferred_device: "cuda"
  dqn:
    batch_size: 32
    replay_buffer_capacity: 16384
    learning_rate: 0.0001
  training:
    learning_starts: 1024
    train_frequency: 4
    target_sync_interval: 10000
    epsilon:
      start: 1.0
      end: 0.05
      decay_steps: 750000
  checkpointing:
    periodic_mode: "lightweight"
    interval_steps: 25000
    full_milestone_interval_steps: 250000
  tensorboard:
    scalar_log_interval_steps: 100
    flush_interval_steps: 5000

smoke:
  enabled: true
  baseline_note: "baseline de implementacion por validar"
  total_timesteps_new: 32
  total_timesteps_resume: 48
  learning_starts: 8
  train_frequency: 4
  target_sync_interval: 16
  checkpoint_mode: "full"
